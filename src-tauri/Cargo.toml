[package]
name = "novel-studio"
version = "0.1.0"
description = "Tauri v2 Native AI Studio for Novelists"
authors = ["NovelStudio Team"]
edition = "2021"

[lib]
name = "novel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.43", features = ["full"] }
notify = "6.1"
git2 = { version = "0.19", features = ["vendored-libgit2", "vendored-openssl"] }
octocrab = { version = "0.42", default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures-util = "0.3"
keyring = "3.2"
regex = "1.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
log = "0.4"
